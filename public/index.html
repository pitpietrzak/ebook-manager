<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets safe-area insets work when launched from the iOS home screen -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Biblioteczka Leniwców</title>
    <meta name="description" content="Your stories, shared & organized." />

    <!-- PWA / "Add to Home Screen" -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#531492" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Biblioteczka" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background-color: #efe7f7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0a0612;
        }
      }
      /* Phone-shaped column on wide screens; full width on phones. */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        max-width: 640px;
        margin: 0 auto;
      }
      @media (min-width: 641px) {
        #root {
          box-shadow: 0 0 40px rgba(0, 0, 0, 0.12);
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
